name: Manual Deploy (on demand)

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: manual-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Enable Solana wallet UI in production build
      VITE_ENABLE_WALLET: 'true'
      # Choose Solana cluster: mainnet | devnet | testnet
      VITE_SOLANA_NETWORK: 'mainnet'
      # Backend API base for linking + $WEALTH balance
      VITE_BACKEND_API_BASE: ${{ secrets.BACKEND_API_BASE }}
      # Optional: provide a dedicated RPC endpoint to avoid public rate limits
      # VITE_SOLANA_RPC_ENDPOINT: ${{ secrets.SOLANA_RPC_ENDPOINT }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
